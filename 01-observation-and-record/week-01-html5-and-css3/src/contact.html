<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Registration - HTML5 Form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 600;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }
        .radio-group {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #64748b; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>Student Registration & Contact Form</h1>
        <p>Please fill out the form below with accurate credentials</p>
    </header>

    <nav>
        <a href="index.html">Back to Home</a>
    </nav>

    <div class="container">
        <section class="card">
            <h2>Registration Form</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="e.g. Manoj Bagadi">
                </div>

                <div class="form-group">
                    <label for="email">College Email ID:</label>
                    <input type="email" id="email" name="email" required placeholder="name@anits.edu.in">
                </div>

                <div class="form-group">
                    <label for="branch">Department / Branch:</label>
                    <select id="branch" name="branch" required>
                        <option value="">Select Branch</option>
                        <option value="CSE">Computer Science & Engineering</option>
                        <option value="CSM">CSE - AI & ML</option>
                        <option value="CSD">CSE - Data Science</option>
                        <option value="ECE">Electronics & Communication</option>
                        <option value="EEE">Electrical & Electronics</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="Male" required> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Feedback / Comments:</label>
                    <textarea id="message" name="message" rows="4" placeholder="Enter your queries or comments..."></textarea>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Submit Registration</button>
                    <button type="reset" class="btn btn-secondary">Reset Form</button>
                </div>
            </form>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 ANITS College Information Portal</p>
    </footer>

</body>
</html>
