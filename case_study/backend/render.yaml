services:
  - type: web
    name: student-records-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_NAME
        value: college_db
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

