<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; }
    .card { background: white; padding: 25px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px; }
    h2 { text-align: center; margin-top: 0; color: #333; }
    label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 12px; }
    input { width: 100%; padding: 8px 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .total-box { margin-top: 20px; padding: 12px; background: #e8f5e9; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; color: #2e7d32; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Product Calculator</h2>

    <label for="product">Product Name:</label>
    <input type="text" id="product" value="Laptop">

    <label for="price">Price ($):</label>
    <input type="number" id="price" value="500" min="0">

    <label for="qty">Quantity:</label>
    <input type="number" id="qty" value="1" min="1">

    <div class="total-box">
      Total: $<span id="total">500.00</span>
    </div>
  </div>

  <script>
    // 1. Get elements from HTML
    const priceInput = document.getElementById('price');
    const qtyInput = document.getElementById('qty');
    const totalDisplay = document.getElementById('total');

    // 2. Function to calculate total price
    function calculateTotal() {
      const price = parseFloat(priceInput.value) || 0;
      const qty = parseInt(qtyInput.value) || 0;
      const total = price * qty;
      totalDisplay.textContent = total.toFixed(2);
    }

    // 3. Attach dynamic event listeners (fires immediately on typing/changing)
    priceInput.addEventListener('input', calculateTotal);
    qtyInput.addEventListener('input', calculateTotal);

    // Initial calculation
    calculateTotal();
  </script>

</body>
</html>
