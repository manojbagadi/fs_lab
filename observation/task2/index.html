<script>

let canvas=document.getElementById("myCanvas");
let ctx=canvas.getContext("2d");

ctx.fillRect(20,20,120,70);

ctx.beginPath();
ctx.arc(220,55,35,0,2*Math.PI);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(20,130);
ctx.lineTo(300,130);
ctx.stroke();

ctx.font="28px Arial";
ctx.fillText("sai",170,190);

</script>
